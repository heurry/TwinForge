name: CI

# Phase 5 / 5B.6：用真实 CI 取代"人工 finish 模拟"——每次 push/PR 自动
# 构建+检查 Go 控制面 / Agent / 前端 / AI 服务，并校验 sqlc 生成与 Helm chart。
on:
  workflow_dispatch:
  push:
    branches: [main, "go-migration-*"]
  pull_request:

jobs:
  go-server:
    runs-on: ubuntu-latest
    env:
      GOWORK: "off" # 按模块独立构建（与本地 Docker 构建一致）
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.22"
          cache-dependency-path: server/go.sum
      - name: build / vet / test
        working-directory: server
        run: |
          go build ./...
          go vet ./...
          go test ./...

  go-agent:
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.22"
          cache-dependency-path: agent/go.sum
      - name: build / vet
        working-directory: agent
        run: |
          go build ./...
          go vet ./...

  sqlc-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: sqlc-dev/setup-sqlc@v5
        with:
          sqlc-version: "1.27.0"
      - name: verify generated code is up to date
        working-directory: server
        run: |
          sqlc generate
          git diff --exit-code -- internal/db/sqlcgen \
            || (echo "::error::sqlc 生成代码与 query/schema 不一致，请在 server/ 跑 'sqlc generate' 并提交"; exit 1)

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: install / typecheck / build
        working-directory: apps/web
        run: |
          npm ci
          npm run build

  ai-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: install / test
        working-directory: apps/ai-service
        run: |
          pip install -r requirements.txt pytest
          pytest -q

  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: azure/setup-helm@v5
        with:
          version: v3.16.4
      - name: lint + template
        run: |
          helm lint deploy/helm/cloudnative-infra-platform
          helm template cip deploy/helm/cloudnative-infra-platform > /dev/null

  # D4：起真实依赖（PostgreSQL + Redis + MinIO）跑全套集成 / e2e / 混沌 / 负载测试。
  # 与 go-server 单测互补——后者无 DB（DB 用例自动 skip）；本 job 让它们真正执行。
  # 串行包（-p 1）：跨包共享同一测试库，避免并行污染搜索表（与本地 Docker 验证一致）。
  integration:
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: infra_platform
          POSTGRES_USER: infra
          POSTGRES_PASSWORD: infra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U infra -d infra_platform"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.22"
          cache-dependency-path: server/go.sum
      - name: start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio server /data
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:9000/minio/health/live && break || sleep 2
          done
      - name: integration / e2e / chaos / load
        working-directory: server
        env:
          TEST_DATABASE_URL: postgres://infra:infra@127.0.0.1:5432/infra_platform?sslmode=disable
          TEST_REDIS_URL: redis://127.0.0.1:6379
          TEST_S3_ENDPOINT: 127.0.0.1:9000
        run: go test ./... -p 1
