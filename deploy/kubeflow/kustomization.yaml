# Phase F / F1：Kubeflow Training Operator（standalone）安装。
# 只装 Training Operator（PyTorchJob CRD），不上 Kubeflow 全家桶（Istio/Pipelines/Katib）。
#
# 安装：  kubectl apply --server-side -k deploy/kubeflow/
# 校验：  kubectl get crd pytorchjobs.kubeflow.org && kubectl -n kubeflow get pods
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # 上游 standalone overlay（含 training-operator Deployment + 各 *Job CRD，pin 版本）。
  - github.com/kubeflow/training-operator/manifests/overlays/standalone?ref=v1.8.1
  # 训练任务的目标命名空间（写操作允许名单：TRAINING_NAMESPACES=training）。
  - training-namespace.yaml
patches:
  # 本地单节点只需要 PyTorchJob。关闭其余 5 类 controller，可显著减少 informer/watch 数量。
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: training-operator
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args
        value:
          - --enable-scheme=pytorchjob
