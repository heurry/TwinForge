# CloudNative Infra Platform — Helm values（5B.5）。
# 镜像默认引用本地构建产物（无 registry 环境）：先 build 并 `minikube image load`，
# pullPolicy=IfNotPresent 即可命中本地镜像。有 registry 时改 repository/tag。

nameOverride: ""
fullnameOverride: ""

imagePullPolicy: IfNotPresent

# go 控制面（单一入口，无状态 → 可多副本）。
goServer:
  replicas: 2
  image:
    repository: cloudnative-infra-platform/go-server
    tag: latest
  service:
    port: 8081
  # 无状态：状态在 PostgreSQL，可水平扩展。
  # 注意：服务注册表 reaper 在每副本各跑一份（SweepStale 幂等，安全但冗余；
  # 生产可加 leader election 仅主副本跑）。
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: "1", memory: 512Mi }
  env:
    AI_REQUEST_TIMEOUT_SECONDS: "90"
    REGISTRY_TTL_SECONDS: "30"
    REGISTRY_SWEEP_SECONDS: "15"
    CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173"
    # A2/A1：K8s 写权限（默认关，serving 命名空间硬禁）。
    ALLOW_K8S_WRITES: "false"
    K8S_WRITE_NAMESPACES: "default"
    # D1：全链路 trace（默认空=不导出；指向集群内 OTLP collector 即开启）。
    OTEL_EXPORTER_OTLP_ENDPOINT: ""
    OTEL_SERVICE_NAME: "go-control-plane"
    # C2：分层存储周期自动归档（默认关；手动 POST /api/storage/archive 始终可用）。
    STORAGE_ARCHIVE_ENABLED: "false"
    # E3：模型路由影子流量（默认关；策略 CRUD 与加权 A/B 路由不受约束，仅镜像受此门禁）。
    ROUTING_SHADOW_ENABLED: "false"
    # E2：在线反馈重排（默认关；关时检索行为不变，仅采集反馈/回流评测；开启后按反馈净分微调候选排序）。
    RAG_RERANK_FEEDBACK: "false"

# 前端（Vite SPA）。nginx 提供静态资源 + 反代 /api → go-server（同源）。
web:
  enabled: true
  replicas: 1
  image:
    repository: cloudnative-infra-platform/web
    tag: latest
  service:
    port: 80
  resources:
    requests: { cpu: 25m, memory: 32Mi }
    limits: { cpu: 250m, memory: 128Mi }

# 对外暴露（可选）。启用需集群装 ingress controller（minikube：addons enable ingress）。
# 关闭时用 `kubectl port-forward svc/<release>-web 8080:80` 访问。
ingress:
  enabled: false
  className: ""
  host: cip.local
  annotations: {}

aiService:
  replicas: 1
  image:
    repository: cloudnative-infra-platform/python-ai-service
    tag: latest
  service:
    port: 8200
  env:
    AI_STUB_MODE: "auto"
    # 不把诊断绑定到固定 27B；部署到集群时可通过 values 覆盖上游地址。
    AI_LLM_MODEL: "auto"
    AI_LLM_CANDIDATE_MODELS: "qwen35-4b-customer,qwen3-4b-customer,qwen36-27b-awq,qwen36-27b-fp8"
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: "1", memory: 512Mi }

# 节点采集 Agent（host/gpu）。以 DaemonSet 每节点一份；默认关闭（需 host 权限/GPU）。
agent:
  enabled: false
  image:
    repository: cloudnative-infra-platform/go-agent
    tag: latest
  service:
    port: 8090
  hostNetwork: false

# 自带 PostgreSQL（演示）。生产建议用托管库：enabled=false 并设 external.url。
postgres:
  enabled: true
  image:
    # 5B.4c：pgvector/pgvector:pg16（带 vector 扩展）；migration 000006 需要它。
    repository: pgvector/pgvector
    tag: pg16
  service:
    port: 5432
  auth:
    user: infra
    password: infra
    database: infra_platform
  persistence:
    enabled: true
    size: 1Gi
  external:
    url: ""  # postgres://user:pass@host:5432/db?sslmode=disable（postgres.enabled=false 时使用）

# 5B.4a：Redis 横切（缓存 / 限流 / 幂等）。缓存型，无持久化；关闭时 go-server 全降级。
redis:
  enabled: true
  image:
    repository: redis
    tag: 7-alpine
  service:
    port: 6379
  resources:
    requests: { cpu: 25m, memory: 32Mi }
    limits: { cpu: 250m, memory: 128Mi }

# 5B.4b：对象存储（S3 兼容，自带 MinIO 演示）。基准报告/评测产物/知识源文件；DB 只存 *_uri。
# 生产可 enabled=false 并设 external.endpoint 指向托管 S3（go-server 只换 endpoint/creds）。
objectstore:
  enabled: true
  image:
    repository: minio/minio
    tag: latest
  bucket: infra-artifacts
  auth:
    accessKey: minioadmin
    secretKey: minioadmin
  service:
    apiPort: 9000
    consolePort: 9001
  persistence:
    enabled: true
    size: 2Gi
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: "1", memory: 512Mi }
  external:
    endpoint: ""  # host:port（objectstore.enabled=false 时指向托管 S3；空=禁用对象存储）

# go-server 经 client-go in-cluster 读集群（pods/deployments/events/nodes/hpa）所需 RBAC。
rbac:
  create: true

# go-server 健康探针（命中 /api/health）。
probes:
  readiness:
    initialDelaySeconds: 5
    periodSeconds: 10
  liveness:
    initialDelaySeconds: 15
    periodSeconds: 20
