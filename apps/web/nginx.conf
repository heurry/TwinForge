# D3：web 容器 nginx 配置（作为 /etc/nginx/templates/default.conf.template，启动时 envsubst）。
# 提供 SPA 静态资源 + 反代 /api 到 go 控制面（同源 → 前端 VITE_API_BASE 留空即可）。
# 只替换 ${GO_SERVER_UPSTREAM}（见 Dockerfile 的 NGINX_ENVSUBST_FILTER），保留 nginx 自身 $vars。
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # index carries the content-hashed bundle names. Never cache it across a
    # deployment, otherwise a browser can keep pointing at the previous SPA
    # even though the Web container was rebuilt successfully.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    # Docker Compose service IPs change whenever a backend container is
    # recreated. A variable proxy_pass plus Docker's embedded resolver avoids
    # pinning the IP that happened to exist when Nginx started.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $go_server_upstream http://${GO_SERVER_UPSTREAM};
    set $agent_api_upstream http://${AGENT_API_UPSTREAM};

    location /api/ {
        proxy_pass $go_server_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;        # SSE（chat:stream / 诊断流）逐块下发，禁用缓冲
        proxy_read_timeout 3600s;
    }

    location /agent-api/ {
        rewrite ^/agent-api/(.*)$ /$1 break;
        proxy_pass $agent_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # A2A standard discovery endpoint is public metadata. Agent API resolves
    # the operator-configured default tenant/Agent; task endpoints stay under
    # /agent-api and retain their normal authentication boundary.
    location = /.well-known/agent-card.json {
        proxy_pass $agent_api_upstream/.well-known/agent-card.json;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA 路由回退：未知路径交给 index.html，由前端 react-router 处理。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
